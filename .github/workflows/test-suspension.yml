
name: Test Suspension Watch

on:
  workflow_dispatch:
  push:
    branches:
      - amishbouva-patch-1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check scripts/odds.mjs
          node --check scripts/build.mjs
      - name: Fetch ESPN data for testing
        run: node scripts/fetch-espn.mjs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
      - name: Build website
        run: node scripts/build.mjs

      - name: Inspect generated homepage
        run: |
          echo "Homepage size:"
          wc -c _site/index.html
          echo "Suspension Watch matches:"
          grep -n -i 'suspension' _site/index.html | head -20 || true
          echo "Newspaper matches:"
          grep -n 'id="news"' _site/index.html | head -5 || true
          echo "Homepage beginning:"
          head -c 500 _site/index.html
          echo
