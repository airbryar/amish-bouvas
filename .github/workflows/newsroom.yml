name: Newsroom data

# Pulls the details the Newspaper is written from (player scores, trades,
# pickups, league history) and saves them to data/newsroom.json.
# Runs Monday, Tuesday, Thursday and Saturday mornings (team pages use it for Top Players), and can
# be started by hand, for example by a Newspaper scheduled task right before each edition.
# It does nothing until the ESPN_S2 / ESPN_SWID secrets are added.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "31 9 * * 1,2,4,6" # Mon, Tue, Thu, Sat around 4:30-5:30 AM Eastern

permissions:
  contents: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        id: go
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: |
          if [ -z "$ESPN_S2" ]; then echo "::notice::Not set up yet: add the ESPN_S2 and ESPN_SWID secrets (see README.md)."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.go.outputs.run == 'true'
        with:
          node-version: 20

      # This week's lineups (who's still to play), for the Monday edition. Never blocks the rest.
      - name: Get this week's lineups
        if: steps.go.outputs.run == 'true'
        run: node scripts/fetch-lineups.mjs
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}

      - name: Gather league details from ESPN
        if: steps.go.outputs.run == 'true'
        run: node scripts/fetch-newsroom.mjs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}

      - name: Save them
        if: steps.go.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newsroom.json
          git commit -m "Update newsroom data" || { echo "No changes"; exit 0; }
          git push || (git pull --rebase origin main && git push)
