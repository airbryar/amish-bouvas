name: Pictures

# When a team picture or the league logo is added, changed or removed, resize it
# for the site, save the result, and republish.
#
# Started by hand (or automatically once after setup), it can also fill in missing team
# pictures from each team's ESPN logo (scripts/import-espn-logos.mjs). Uploaded pictures are
# never replaced.
on:
  push:
    branches: [main]
    paths: ["team-pictures/**", "league-logo/**"]
  workflow_dispatch:
    inputs:
      from_espn:
        description: "Also fill in missing team pictures from each team's ESPN logo"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: pictures
  cancel-in-progress: false

jobs:
  pictures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get the image tool
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.33.5

      # Team pictures are matched to the current team names, so read them fresh
      - name: Get the latest team names from ESPN
        run: node scripts/fetch-espn.mjs
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}

      - name: Fill in missing team pictures from ESPN
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.from_espn != 'false'
        run: node scripts/import-espn-logos.mjs
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}

      - name: Make the site-size team pictures
        run: node scripts/make-logos.mjs

      - name: Make the league logo and home-screen icon
        run: node scripts/make-brand.mjs

      - name: Save them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- data/espn.json 2>/dev/null || true # the site update saves this one
          git add -A site data team-pictures
          if git diff --cached --quiet; then
            echo "Pictures already up to date"
          else
            git commit -m "Update pictures"
            git push || (git pull --rebase origin main && git push)
          fi

      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}' && echo "Site update started"
